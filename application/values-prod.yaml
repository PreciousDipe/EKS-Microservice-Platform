frontend:
  hpa:
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 50

backend:
  productService:
    hpa:
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 60
    resources:
      requests:
        cpu: 200m
        memory: 192Mi
      limits:
        cpu: "1"
        memory: 384Mi
  orderService:
    hpa:
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 60
    resources:
      requests:
        cpu: 200m
        memory: 192Mi
      limits:
        cpu: "1"
        memory: 384Mi

database:
  storage: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

pdb:
  minAvailable: 2
