apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-app-config
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "shop.componentLabels" (dict "name" "frontend" "partOf" "app" "tier" "frontend" "ctx" $) | nindent 4 }}
data:
  FRONTEND_APP_PORT: {{ .Values.frontend.port | quote }}
---
# The page itself, read from files/index.html (the HTML is not copied into YAML).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-page
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "shop.componentLabels" (dict "name" "frontend" "partOf" "app" "tier" "frontend" "ctx" $) | nindent 4 }}
data:
  index.html: |-
    {{- .Files.Get "files/index.html" | nindent 4 }}
