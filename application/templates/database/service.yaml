# Headless: gives the StatefulSet pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "shop.componentLabels" (dict "name" "postgres" "partOf" "database" "tier" "database" "ctx" $) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
