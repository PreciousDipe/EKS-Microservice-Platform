apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: cache
    {{- include "shop.labels" . | nindent 4 }}
data:
  REDIS_MAXMEMORY: {{ .Values.cache.maxmemory | quote }}
  REDIS_MAXMEMORY_POLICY: {{ .Values.cache.maxmemoryPolicy | quote }}
