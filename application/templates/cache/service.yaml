apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "shop.componentLabels" (dict "name" "redis" "partOf" "cache" "tier" "cache" "ctx" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
